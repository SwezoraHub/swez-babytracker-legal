<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Swez BabyTracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f8f7fb;
      color: #222;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .card {
      background: #ffffff;
      padding: 42px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .subtitle {
      color: #666;
      font-size: 17px;
      margin-bottom: 34px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 420px;
      margin: 0 auto;
    }

    .button {
      display: block;
      padding: 15px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      background: #eee8f8;
      color: #63478f;
    }

    .button:hover {
      background: #e4d9f2;
    }

    .contact {
      margin-top: 32px;
      color: #666;
      font-size: 14px;
    }

    footer {
      margin-top: 34px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">

      <h1>Swez BabyTracker</h1>

      <p class="subtitle">
        Privacy Policy and Terms of Service
      </p>

      <div class="links">

        <a class="button" href="privacy.html">
          Privacy Policy
        </a>

        <a class="button" href="terms.html">
          Terms of Service
        </a>

      </div>

      <div class="contact">
        Privacy &amp; support:
        <strong>swezora@gmail.com</strong>
      </div>

      <footer>
        © 2026 Swez BabyTracker. All rights reserved.
      </footer>

    </div>
  </div>
</body>
</html>
